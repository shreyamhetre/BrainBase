<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Knowhere: one brain across your company's tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1b1446"/>
      <stop offset="1" stop-color="#3a1a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <!-- background stars -->
  <g fill="#ffffff">
    <circle cx="420" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="560" cy="250" r="1" opacity="0.5"/>
    <circle cx="700" cy="30" r="1.4" opacity="0.7"/>
    <circle cx="880" cy="265" r="1" opacity="0.5"/>
    <circle cx="1010" cy="45" r="1.3" opacity="0.6"/>
    <circle cx="1150" cy="140" r="1" opacity="0.5"/>
    <circle cx="1100" cy="250" r="1.5" opacity="0.6"/>
    <circle cx="640" cy="120" r="0.9" opacity="0.4"/>
    <circle cx="960" cy="150" r="0.9" opacity="0.4"/>
  </g>

  <!-- constellation: sources connected to a central brain node -->
  <circle cx="190" cy="150" r="95" fill="url(#glow)"/>
  <g stroke="#a78bfa" stroke-width="2" stroke-opacity="0.7">
    <line x1="190" y1="150" x2="95" y2="80"/>
    <line x1="190" y1="150" x2="290" y2="70"/>
    <line x1="190" y1="150" x2="305" y2="185"/>
    <line x1="190" y1="150" x2="230" y2="255"/>
    <line x1="190" y1="150" x2="100" y2="225"/>
    <line x1="190" y1="150" x2="60" y2="150"/>
  </g>
  <g stroke="#a78bfa" stroke-width="1" stroke-opacity="0.35">
    <line x1="95" y1="80" x2="290" y2="70"/>
    <line x1="290" y1="70" x2="305" y2="185"/>
    <line x1="305" y1="185" x2="230" y2="255"/>
    <line x1="230" y1="255" x2="100" y2="225"/>
    <line x1="100" y1="225" x2="60" y2="150"/>
    <line x1="60" y1="150" x2="95" y2="80"/>
  </g>
  <g fill="#ffffff">
    <circle cx="95" cy="80" r="7"/>
    <circle cx="290" cy="70" r="7"/>
    <circle cx="305" cy="185" r="7"/>
    <circle cx="230" cy="255" r="7"/>
    <circle cx="100" cy="225" r="7"/>
    <circle cx="60" cy="150" r="7"/>
  </g>
  <circle cx="190" cy="150" r="26" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
  <circle cx="190" cy="150" r="9" fill="#ffffff"/>

  <!-- text -->
  <text x="380" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="url(#title)" letter-spacing="-1">Knowhere</text>
  <text x="384" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ddd6fe">One brain across your company's tools.</text>
  <text x="384" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#a5b4fc" opacity="0.9">Cited answers · real permissions · actions through MCP</text>
</svg>
