<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Brainbase</title>
  <desc id="desc">Brainbase: a configurable foundation for company intelligence. GitMore is its reference implementation for the GitLab ecosystem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1c2639"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb15c"/>
      <stop offset=".55" stop-color="#fc6d26"/>
      <stop offset="1" stop-color="#e84b13"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- Icon: a network of sources around one knowledge core -->
  <g transform="translate(160 160)" stroke-linecap="round" stroke-linejoin="round">
    <circle r="112" fill="#fc6d26" opacity=".07"/>
    <g fill="none" stroke="#8ca0bb" stroke-width="3">
      <path d="M0 -82 L69 -42 L69 39 L0 81 L-69 39 L-69 -42 Z"/>
      <path d="M0 -82 L0 -22 L69 -42 M0 -22 L-69 -42 M0 -22 L69 39 M0 -22 L-69 39 M0 -22 L0 81"/>
    </g>
    <circle r="53" fill="none" stroke="#fc6d26" stroke-width="1.5" stroke-dasharray="3 9" opacity=".6"/>
    <g fill="url(#orange)">
      <circle cx="0" cy="-82" r="10"/>
      <circle cx="-69" cy="-42" r="8"/>
      <circle cx="69" cy="-42" r="8"/>
      <circle cx="-69" cy="39" r="8"/>
      <circle cx="69" cy="39" r="8"/>
      <circle cx="0" cy="81" r="10"/>
    </g>
    <g>
      <path d="M-31 -19 L-11 -49 L0 -21 L11 -49 L31 -19 L0 21 Z" fill="#ffffff"/>
      <path d="M-31 -19 L-11 -49 L-15 -5 L0 21 Z" fill="#ffc17e"/>
      <path d="M31 -19 L11 -49 L15 -5 L0 21 Z" fill="#fc6d26"/>
      <path d="M-15 -5 L0 -21 L15 -5 L0 21 Z" fill="#ff8c43"/>
    </g>
  </g>

  <!-- Name and promise -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="312" y="140" font-size="76" font-weight="700" letter-spacing="-2.5"><tspan fill="#ffffff">Brain</tspan><tspan fill="#ff8c43">base</tspan></text>
    <rect x="315" y="162" width="96" height="5" rx="2.5" fill="url(#orange)"/>
    <text x="314" y="206" fill="#d9e0ec" font-size="24" font-weight="500">A configurable foundation for company intelligence.</text>

    <!-- Capabilities as chips -->
    <g font-size="14" font-weight="600">
      <rect x="314" y="232" width="128" height="32" rx="16" fill="#243049" stroke="#3b4a61"/>
      <text x="378" y="253" fill="#d9e0ec" text-anchor="middle">Hybrid RAG</text>
      <rect x="454" y="232" width="122" height="32" rx="16" fill="#243049" stroke="#3b4a61"/>
      <text x="515" y="253" fill="#d9e0ec" text-anchor="middle">Connectors</text>
      <rect x="588" y="232" width="190" height="32" rx="16" fill="#243049" stroke="#3b4a61"/>
      <text x="683" y="253" fill="#d9e0ec" text-anchor="middle">Permission-aware search</text>
      <rect x="790" y="232" width="152" height="32" rx="16" fill="#243049" stroke="#3b4a61"/>
      <text x="866" y="253" fill="#d9e0ec" text-anchor="middle">Agentic workflows</text>
    </g>
  </g>

  <!-- Reference implementation tag -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="968" y="44" width="196" height="72" rx="14" fill="#1d293b" stroke="#fc6d26" stroke-opacity=".7"/>
    <text x="986" y="72" fill="#98a8bf" font-size="12" font-weight="600" letter-spacing="1.5">REFERENCE APP</text>
    <text x="986" y="100" fill="#ffffff" font-size="22" font-weight="700"><tspan>Git</tspan><tspan fill="#ff8c43">More</tspan></text>
  </g>
</svg>
