<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Brainbase</title>
  <desc id="desc">An animated network brain icon with the tagline A configurable foundation for company intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#202b40"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb15c"/>
      <stop offset=".55" stop-color="#fc6d26"/>
      <stop offset="1" stop-color="#e84b13"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#ff995c"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="165" cy="170" r="105" fill="#fc6d26" opacity=".08">
    <animate attributeName="r" values="90;115;90" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(165 165)" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke="#8ca0bb" stroke-width="3" opacity=".9">
      <path d="M0 -82 L69 -42 L69 39 L0 81 L-69 39 L-69 -42 Z"/>
      <path d="M0 -82 L0 -22 L69 -42 M0 -22 L-69 -42 M0 -22 L69 39 M0 -22 L-69 39 M0 -22 L0 81"/>
      <path d="M-69 -42 L-35 0 L-69 39 M69 -42 L35 0 L69 39" opacity=".5"/>
    </g>
    <g fill="url(#orange)" filter="url(#glow)">
      <circle cx="0" cy="-82" r="10"><animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="-69" cy="-42" r="8"/>
      <circle cx="69" cy="-42" r="8"/>
      <circle cx="-69" cy="39" r="8"/>
      <circle cx="69" cy="39" r="8"/>
      <circle cx="0" cy="81" r="10"/>
      <circle cx="0" cy="-22" r="12"><animate attributeName="r" values="10;13;10" dur="2.4s" begin=".4s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ffffff" opacity=".95">
      <path d="M-31 -19 L-11 -49 L0 -21 L11 -49 L31 -19 L0 21 Z" opacity=".95"/>
      <path d="M-31 -19 L-11 -49 L-15 -5 L0 21 Z" fill="#ffc17e"/>
      <path d="M31 -19 L11 -49 L15 -5 L0 21 Z" fill="#fc6d26"/>
      <path d="M-15 -5 L0 -21 L15 -5 L0 21 Z" fill="#ff8c43"/>
    </g>
    <circle r="53" fill="none" stroke="#fc6d26" stroke-width="1.5" stroke-dasharray="3 10" opacity=".65">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="300" y="154" fill="url(#text)" font-size="78" font-weight="750" letter-spacing="-3">Brainbase</text>
    <rect x="302" y="178" width="112" height="5" rx="2.5" fill="url(#orange)">
      <animate attributeName="width" values="42;112;42" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="302" y="220" fill="#d4dceb" font-size="25" font-weight="500">A configurable foundation for company intelligence.</text>
    <text x="302" y="263" fill="#98a8bf" font-size="17">RAG  ·  Connectors  ·  Permissions  ·  Agentic workflows</text>
  </g>
  <g fill="#fc6d26" opacity=".8">
    <circle cx="1090" cy="62" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="92" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="104" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>
</svg>