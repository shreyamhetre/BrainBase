<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d">
<title id="t">GitMore product demo concept</title><desc id="d">A conceptual interface with a question and cited answer, connected sources, and role-based access status.</desc>
