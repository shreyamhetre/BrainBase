<text x="61" y="143" fill="#e8edf5" font-family="Arial,sans-serif" font-size="13">What is our process for reporting a security incident?</text>
<text x="61" y="160" fill="#8fa2bb" font-family="Arial,sans-serif" font-size="11">Example question</text>
<rect x="44" y="191" width="640" height="155" rx="10" fill="#202e42" stroke="#40516a"/>
<circle cx="66" cy="215" r="8" fill="url(#orange)"/>
<text x="83" y="220" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Answer with evidence</text>
<text x="61" y="247" fill="#d7e0ed" font-family="Arial,sans-serif" font-size="12">Follow the documented incident reporting procedure.</text>
<text x="61" y="267" fill="#d7e0ed" font-family="Arial,sans-serif" font-size="12">The exact steps and escalation path should be verified</text>
<text x="61" y="287" fill="#d7e0ed" font-family="Arial,sans-serif" font-size="12">against the applicable security documentation.</text>
