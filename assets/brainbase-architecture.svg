<text x="732" y="523" class="t" fill="#1e2a4a">Hybrid search</text>
<text x="706" y="546" class="l" fill="#5d647e">Vector + keyword</text>
<text x="706" y="564" class="l" fill="#5d647e">Permission filter in SQL</text>
