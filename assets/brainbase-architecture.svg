<circle cx="344" cy="174" r="10" fill="#fc6d26"/><text x="344" y="178" text-anchor="middle" class="ic">1</text>
<text x="362" y="179" class="t" fill="#1e2a4a">Connectors &amp; sync</text>
<text x="336" y="202" class="l" fill="#5d647e">Scheduled + Sync now, per connector</text>
<text x="336" y="220" class="l" fill="#5d647e">Hash compare: unchanged is skipped</text>
<text x="336" y="238" class="l" fill="#5d647e">Removes what left the source</text>
<text x="336" y="256" class="l" fill="#5d647e">Roles from the access mapping</text>
</g>
<g class="box"><rect x="630" y="150" width="250" height="130" rx="14" fill="#ffffff" stroke="#e6e3ef" stroke-width="1.5"/>
<circle cx="654" cy="174" r="10" fill="#fc6d26"/><text x="654" y="178" text-anchor="middle" class="ic">2</text>
<text x="672" y="179" class="t" fill="#1e2a4a">Parse · clean · chunk · embed</text>
<text x="646" y="202" class="l" fill="#5d647e">Markdown, PDF and Word to text</text>
<text x="646" y="220" class="l" fill="#5d647e">Split at headings, breadcrumbs kept</text>
<text x="646" y="238" class="l" fill="#5d647e">BGE-M3 embeddings (1024-d)</text>
<text x="646" y="256" class="l" fill="#5d647e">Batched on the GPU</text>
</g>
<g class="box"><rect x="940" y="118" width="300" height="196" rx="14" fill="#1e2a4a" stroke="#1e2a4a" stroke-width="1.5"/>
<circle cx="964" cy="142" r="10" fill="#fc6d26"/><text x="964" y="146" text-anchor="middle" class="ic">3</text>
<text x="982" y="147" class="t" fill="#ffffff">PostgreSQL 18 + pgvector</text>
<text x="956" y="170" class="l" fill="#c9d1ef">Chunks with HNSW vectors</text>
<text x="956" y="188" class="l" fill="#c9d1ef">Full-text index (GIN)</text>
<text x="956" y="206" class="l" fill="#c9d1ef">Allowed roles on every chunk</text>
<text x="956" y="224" class="l" fill="#c9d1ef">Users, sessions, roles, access</text>
<text x="956" y="242" class="l" fill="#c9d1ef">Conversations, actions, usage log</text>
<text x="956" y="260" class="l" fill="#c9d1ef">Settings and activity log</text>
</g>
