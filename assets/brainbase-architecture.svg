<text x="1096" y="546" class="l" fill="#5d647e">Jev (TypeSafe)</text>
<text x="1096" y="564" class="l" fill="#5d647e">Enough evidence?</text>
</g>
<g class="box"><rect x="1080" y="650" width="160" height="96" rx="14" fill="#ffffff" stroke="#e6e3ef" stroke-width="1.5"/>
