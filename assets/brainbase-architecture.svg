<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img"
 aria-label="BrainBase architecture: sources are synced, chunked and embedded into PostgreSQL with pgvector; a question passes the router, permission-filtered hybrid search, reranking and the Jev evidence gate before GPT writes a cited answer; actions go through MCP with confirmation; everything is traced and evaluated.">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#fc6d26"/></marker>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fff8f4"/></linearGradient>
</defs>
<style>
text { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.t { font-size: 15px; font-weight: 650; }
.l { font-size: 12.5px; }
.c { font-size: 12px; fill: #1e2a4a; font-weight: 550; }
.ic { font-size: 11px; fill: #fff; font-weight: 700; }
.sec { font-size: 12px; font-weight: 750; letter-spacing: 2px; fill: #e24329; }
.lab { font-size: 12px; fill: #e24329; font-weight: 600; }
.muted { font-size: 12px; fill: #5d647e; }
.flow { fill: none; stroke: #fc6d26; stroke-width: 2; stroke-dasharray: 7 7; animation: dash 1.1s linear infinite; }
.soft { fill: none; stroke: #f3b394; stroke-width: 1.6; stroke-dasharray: 4 6; animation: dash 1.6s linear infinite; }
.retry { fill: none; stroke: #e24329; stroke-width: 2; stroke-dasharray: 3 7; animation: dash 0.9s linear infinite; }
.dot { fill: #e24329; }
.brandbox rect { animation: glow 2.4s ease-in-out infinite; }
@keyframes dash { to { stroke-dashoffset: -28; } }
@keyframes glow { 0%, 100% { stroke-width: 1.5; } 50% { stroke-width: 3.5; } }
@media (prefers-reduced-motion: reduce) { .flow, .soft, .retry, .brandbox rect { animation: none; } .dot { display: none; } }
</style>
