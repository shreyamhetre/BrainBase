<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="t d">
  <title id="t">Brainbase architecture</title>
  <desc id="d">Admins configure connectors, access mapping, models and MCP tools in the app. Ingestion syncs sources on a schedule or on demand, chunks them, attaches allowed roles, embeds with BGE-M3 and stores them in PostgreSQL with pgvector. The LangGraph query path runs hybrid search with the role filter inside the SQL query, fuses and reranks results, and writes a cited answer. A router also sends requests to live lookups, confirmed MCP actions or a clarifying question. Tracing, evaluation and an activity log observe every step.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fc6d26"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1098" height="598" rx="20" fill="#111827" stroke="#2b3a52"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <!-- 1. CONFIGURE -->
    <text x="32" y="42" fill="#ff995c" font-size="13" font-weight="700" letter-spacing="2">1 · CONFIGURE IN THE APP</text>
    <g fill="#1d293b" stroke="#3b4a61">
      <rect x="32" y="56" width="244" height="56" rx="12"/>
      <rect x="296" y="56" width="244" height="56" rx="12"/>
      <rect x="560" y="56" width="244" height="56" rx="12"/>
      <rect x="824" y="56" width="244" height="56" rx="12"/>
    </g>
    <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
      <text x="154" y="80">Connectors</text>
      <text x="418" y="80">Roles and access mapping</text>
      <text x="682" y="80">Models</text>
      <text x="946" y="80">MCP tools</text>
    </g>
    <g font-size="12" fill="#98a8bf" text-anchor="middle">
      <text x="154" y="99">GitLab · Slack · encrypted tokens</text>
      <text x="418" y="99">Who reads each channel or project</text>
      <text x="682" y="99">LLM · embeddings · reranker</text>
      <text x="946" y="99">Which tools, for which roles</text>
    </g>

    <!-- 2. INGEST -->
    <text x="32" y="152" fill="#ff995c" font-size="13" font-weight="700" letter-spacing="2">2 · INGEST IN THE BACKGROUND</text>
    <g fill="#1d293b" stroke="#fc6d26" stroke-opacity=".75">
      <rect x="32" y="166" width="188" height="62" rx="12"/>
      <rect x="245" y="166" width="188" height="62" rx="12"/>
      <rect x="458" y="166" width="188" height="62" rx="12"/>
      <rect x="671" y="166" width="188" height="62" rx="12"/>
    </g>
    <rect x="884" y="166" width="184" height="62" rx="12" fill="#fc6d26"/>
    <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
      <text x="126" y="192">Sync</text>
      <text x="339" y="192">Parse and chunk</text>
      <text x="552" y="192">Attach allowed roles</text>
      <text x="765" y="192">Embed</text>
      <text x="976" y="192">PostgreSQL</text>
    </g>
    <g font-size="12" fill="#98a8bf" text-anchor="middle">
      <text x="126" y="211">On a schedule · Sync now</text>
      <text x="339" y="211">Headings · threads · issues</text>
      <text x="552" y="211">From the access mapping</text>
      <text x="765" y="211">BGE-M3, on the GPU</text>
      <text x="976" y="211" fill="#fff4ec">pgvector + full-text</text>
    </g>
    <g stroke="#fc6d26" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M220 197 H241"/>
      <path d="M433 197 H454"/>
      <path d="M646 197 H667"/>
      <path d="M859 197 H880"/>
    </g>

    <!-- index feeds search: one elbow, clear of all labels -->
    <path d="M976 228 V250 H552 V280" stroke="#fc6d26" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="764" y="244" fill="#98a8bf" font-size="11.5" text-anchor="middle">only rows the asker's roles allow</text>

    <!-- 3. QUERY -->
    <text x="32" y="270" fill="#ff995c" font-size="13" font-weight="700" letter-spacing="2">3 · ANSWER WITH LANGGRAPH</text>
    <g fill="#1d293b" stroke="#3b4a61">
      <rect x="32" y="284" width="188" height="62" rx="12"/>
      <rect x="458" y="284" width="188" height="62" rx="12"/>
      <rect x="671" y="284" width="188" height="62" rx="12"/>
      <rect x="884" y="284" width="184" height="62" rx="12"/>
    </g>
    <rect x="245" y="284" width="188" height="62" rx="12" fill="#1d293b" stroke="#fc6d26" stroke-opacity=".75"/>
    <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
      <text x="126" y="310">Question</text>
      <text x="339" y="310">Router</text>
      <text x="552" y="310">Hybrid search</text>
      <text x="765" y="310">Fuse and rerank</text>
      <text x="976" y="310">Cited answer</text>
    </g>
    <g font-size="12" fill="#98a8bf" text-anchor="middle">
      <text x="126" y="329">Login cookie · user's roles</text>
      <text x="339" y="329">What does this need?</text>
      <text x="552" y="329">Role filter inside the SQL</text>
      <text x="765" y="329">RRF · BGE reranker</text>
      <text x="976" y="329">GPT-4o mini · sources</text>
    </g>
    <g stroke="#fc6d26" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M220 315 H241"/>
      <path d="M433 315 H454"/>
      <path d="M646 315 H667"/>
      <path d="M859 315 H880"/>
    </g>

    <!-- other routes the router can take -->
    <path d="M339 346 V384" stroke="#fc6d26" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="132" y="388" width="414" height="58" rx="12" fill="#1d293b" stroke="#3b4a61"/>
    <text x="339" y="412" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Live lookup · MCP action · clarify</text>
    <text x="339" y="431" fill="#98a8bf" font-size="12" text-anchor="middle">Role-checked, confirmed by the user, written to the activity log</text>

    <!-- 4. OBSERVE -->
    <text x="32" y="494" fill="#ff995c" font-size="13" font-weight="700" letter-spacing="2">4 · OBSERVE AND CONTROL</text>
    <g fill="#1d293b" stroke="#3b4a61">
      <rect x="32" y="508" width="333" height="62" rx="12"/>
      <rect x="384" y="508" width="333" height="62" rx="12"/>
      <rect x="736" y="508" width="332" height="62" rx="12"/>
    </g>
    <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
      <text x="198" y="534">Langfuse tracing</text>
      <text x="550" y="534">Evaluation and tests</text>
      <text x="902" y="534">Activity log</text>
    </g>
    <g font-size="12" fill="#98a8bf" text-anchor="middle">
      <text x="198" y="553">Chunks, prompt, tokens, cost, latency</text>
      <text x="550" y="553">Retrieval metrics · no-leak checks per role</text>
      <text x="902" y="553">Every role, access and connector change</text>
    </g>
  </g>
</svg>
